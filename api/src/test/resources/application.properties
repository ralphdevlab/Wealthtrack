spring.application.name=wealthtrack-test

# In-memory database so tests run anywhere (CI included) without Postgres
spring.datasource.url=jdbc:h2:mem:wealthtrack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only values, never used in production
jwt.secret=test-only-signing-secret-at-least-32-bytes-long
finnhub.api.key=test
openai.api.key=test
